<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SM Store - الدفع</title>
<link rel="icon" type="image/png" href="storecon.png">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase.js"></script>
<script src="https://js.stripe.com/v3/"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0e0f11;--surface:#18191d;--surface2:#1f2025;
  --accent:#0074e4;--accent2:#00d4ff;
  --text:#ffffff;--text2:#a0a4b8;--text3:#5a5e72;
  --border:rgba(255,255,255,0.07);--success:#00e676;--error:#ff4757;
}
body{background:var(--bg);color:var(--text);font-family:'Cairo',sans-serif;min-height:100vh;}

nav{
  position:fixed;top:0;left:0;right:0;z-index:1000;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 48px;height:64px;
  background:rgba(14,15,17,0.95);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}
.nav-logo{font-family:'Rajdhani',sans-serif;font-size:22px;font-weight:700;letter-spacing:2px;display:flex;align-items:center;gap:10px;}
.nav-logo::before{content:'';width:28px;height:28px;background:var(--accent);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);display:block;}
.back-link{color:var(--text2);font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;transition:.2s;cursor:pointer;}
.back-link:hover{color:var(--text);}

.page{
  max-width:900px;margin:0 auto;
  padding:96px 24px 60px;
}

.page-title{
  font-family:'Rajdhani',sans-serif;
  font-size:32px;font-weight:700;letter-spacing:.5px;
  margin-bottom:8px;
  display:flex;align-items:center;gap:12px;
}
.page-title::before{content:'';width:4px;height:30px;background:linear-gradient(var(--accent),var(--accent2));border-radius:2px;}
.page-sub{font-size:14px;color:var(--text2);margin-bottom:40px;padding-right:16px;}

.layout{display:grid;grid-template-columns:1fr 380px;gap:24px;}

/* ORDER SUMMARY */
.order-card{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  overflow:hidden;
}

.game-preview{
  display:flex;gap:16px;padding:24px;
  border-bottom:1px solid var(--border);
  align-items:center;
}
.game-preview img{
  width:80px;height:80px;border-radius:8px;object-fit:cover;flex-shrink:0;
  background:#111;
}
.game-preview h3{font-size:18px;font-weight:700;margin-bottom:4px;}
.game-preview .price{
  font-family:'Rajdhani',sans-serif;font-size:28px;font-weight:700;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}

.order-details{padding:20px 24px;}
.detail-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--border);
  font-size:14px;
}
.detail-row:last-child{border-bottom:none;padding-bottom:0;}
.detail-label{color:var(--text2);}
.detail-val{font-weight:700;}
.detail-row.total .detail-label{font-size:16px;font-weight:700;color:var(--text);}
.detail-row.total .detail-val{
  font-family:'Rajdhani',sans-serif;font-size:24px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}

/* PAYMENT FORM */
.payment-card{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:28px;
}

.section-label{
  font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  color:var(--text2);margin-bottom:16px;padding-bottom:10px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;
}
.section-label svg{opacity:.6;}

.field{margin-bottom:16px;}
.field label{
  display:block;font-size:12px;font-weight:700;letter-spacing:.8px;
  text-transform:uppercase;color:var(--text2);margin-bottom:8px;
}
.field input{
  width:100%;background:var(--surface2);border:1px solid var(--border);
  color:var(--text);padding:13px 16px;border-radius:8px;
  font-size:15px;font-family:'Cairo',sans-serif;
  outline:none;transition:.2s;
}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,116,228,0.12);}
.field input::placeholder{color:var(--text3);}

/* Stripe Element Container */
#card-element{
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:8px;
  padding:14px 16px;
  transition:.2s;
  direction:ltr;
}
#card-element.focused{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(0,116,228,0.12);
}
#card-errors{
  color:var(--error);
  font-size:13px;
  margin-top:8px;
  margin-bottom:8px;
  min-height:18px;
}

/* Stripe badge */
.stripe-badge{
  display:flex;align-items:center;gap:6px;
  font-size:12px;color:var(--text3);margin-top:10px;margin-bottom:16px;
}
.stripe-badge svg{opacity:.5;}

.pay-btn{
  width:100%;background:var(--accent);color:#fff;border:none;
  padding:16px;border-radius:8px;font-size:16px;font-weight:700;
  font-family:'Cairo',sans-serif;cursor:pointer;transition:.25s;
  letter-spacing:.5px;margin-top:8px;
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.pay-btn:hover{background:#0088ff;box-shadow:0 8px 24px rgba(0,116,228,0.35);}
.pay-btn:disabled{background:#333;color:#666;cursor:not-allowed;box-shadow:none;}

.secure-note{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-top:16px;font-size:13px;color:var(--text3);
}

.alert{
  padding:12px 16px;border-radius:8px;
  font-size:14px;font-weight:600;margin-bottom:16px;
  display:none;
}
.alert.error{background:rgba(255,71,87,0.12);border:1px solid rgba(255,71,87,0.3);color:var(--error);}
.alert.success{background:rgba(0,230,118,0.1);border:1px solid rgba(0,230,118,0.3);color:var(--success);}

/* SUCCESS STATE */
.success-state{
  text-align:center;padding:40px;display:none;
}
.success-icon{
  width:80px;height:80px;border-radius:50%;
  background:rgba(0,230,118,0.1);border:2px solid rgba(0,230,118,0.3);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 20px;
}
.success-state h2{font-family:'Rajdhani',sans-serif;font-size:28px;font-weight:700;margin-bottom:8px;}
.success-state p{color:var(--text2);margin-bottom:24px;}
.goto-lib{
  background:var(--accent);color:#fff;border:none;
  padding:12px 28px;border-radius:8px;font-size:15px;font-weight:700;
  font-family:'Cairo',sans-serif;cursor:pointer;transition:.2s;
}
.goto-lib:hover{background:#0088ff;}

/* Spinner */
.spinner{
  width:18px;height:18px;border:2px solid rgba(255,255,255,0.3);
  border-top-color:#fff;border-radius:50%;
  animation:spin .7s linear infinite;display:none;
}
@keyframes spin{to{transform:rotate(360deg);}}

@media(max-width:768px){
  nav{padding:0 20px;}
  .layout{grid-template-columns:1fr;}
  .layout>div:first-child{order:2;}
  .payment-card{order:1;}
}
</style>
</head>
<body>

<nav>
  <div class="nav-logo">SM Store</div>
  <span class="back-link" onclick="history.back()">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    رجوع
  </span>
</nav>

<div class="page">
  <div class="page-title">إتمام الشراء</div>
  <div class="page-sub">أدخل بيانات بطاقتك لإتمام العملية بأمان عبر Stripe</div>

  <div class="layout">
    <!-- Order Summary -->
    <div class="order-card">
      <div class="game-preview">
        <img id="gameImg" src="" alt="">
        <div>
          <h3 id="gameName">جاري التحميل...</h3>
          <div class="price" id="gamePrice">—</div>
        </div>
      </div>
      <div class="order-details">
        <div class="detail-row">
          <span class="detail-label">سعر الملف</span>
          <span class="detail-val" id="subtotal">—</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">رسوم المعالجة</span>
          <span class="detail-val" style="color:#00e676">مجاني</span>
        </div>
        <div class="detail-row total">
          <span class="detail-label">الإجمالي</span>
          <span class="detail-val" id="total">—</span>
        </div>
      </div>
    </div>

    <!-- Payment Form -->
    <div class="payment-card">
      <div id="alert" class="alert"></div>

      <div id="formContent">
        <div class="section-label">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2"/><path d="M1 10h22"/></svg>
          بيانات البطاقة
        </div>

        <!-- Stripe Card Element -->
        <div class="field">
          <label>رقم البطاقة / تاريخ الانتهاء / CVV</label>
          <div id="card-element"></div>
          <div id="card-errors"></div>
        </div>

        <!-- Stripe Security Badge -->
        <div class="stripe-badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          مدفوع بأمان عبر Stripe — بياناتك مشفّرة بالكامل
        </div>

        <button class="pay-btn" id="payBtn" onclick="pay()">
          <div class="spinner" id="spinner"></div>
          <svg id="btnIcon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span id="btnText">تأكيد الدفع</span>
        </button>

        <div class="secure-note">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          دفع آمن ومشفر بـ SSL
        </div>
      </div>

      <!-- Success State -->
      <div class="success-state" id="successState">
        <div class="success-icon">
          <svg width="36" height="36" fill="none" stroke="#00e676" stroke-width="2.5" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </div>
        <h2>تم الشراء بنجاح!</h2>
        <p>الملف أُضيف لمكتبتك. يمكنك تحميله الآن.</p>
        <button class="goto-lib" onclick="location.href='library.html'">الذهاب للمكتبة</button>
      </div>
    </div>
  </div>
</div>

<script>
// ─── Stripe Setup ───────────────────────────────────────────────
const stripe = Stripe('pk_test_51TPlrtRo5jOLZLnR9RM6qP1rpzwJvioAbi6Ji20uHNY9m9pBNXJxaH7pL57RrF0pq8NCyPVz8E5s5U4YLYt3gGwc00oOO8oXAS');
const elements = stripe.elements();

const cardElement = elements.create('card', {
  style: {
    base: {
      color: '#ffffff',
      fontFamily: "'Cairo', sans-serif",
      fontSize: '15px',
      fontSmoothing: 'antialiased',
      '::placeholder': { color: '#5a5e72' },
      iconColor: '#a0a4b8',
    },
    invalid: {
      color: '#ff4757',
      iconColor: '#ff4757',
    }
  },
  hidePostalCode: true
});

cardElement.mount('#card-element');

cardElement.on('focus', () => document.getElementById('card-element').classList.add('focused'));
cardElement.on('blur',  () => document.getElementById('card-element').classList.remove('focused'));
cardElement.on('change', (e) => {
  document.getElementById('card-errors').textContent = e.error ? e.error.message : '';
});

// ─── Load Game Info ─────────────────────────────────────────────
const gameId = localStorage.getItem("buyGame");
let gamePrice = 0;

async function loadGame() {
  if (!gameId) return;
  const snap = await db.ref("games/" + gameId).once("value");
  const game = snap.val();
  if (!game) return;
  gamePrice = Number(game.price);
  document.getElementById("gameName").textContent = game.name;
  document.getElementById("gameImg").src = game.coverImage || "";
  document.getElementById("gamePrice").textContent = game.price + "$";
  document.getElementById("subtotal").textContent = game.price + "$";
  document.getElementById("total").textContent = game.price + "$";
}
loadGame();

// ─── Helpers ────────────────────────────────────────────────────
function showAlert(msg, type = "error") {
  const el = document.getElementById("alert");
  el.textContent = msg;
  el.className = "alert " + type;
  el.style.display = "block";
  if (type === "error") setTimeout(() => el.style.display = "none", 5000);
}

function setLoading(loading) {
  const btn = document.getElementById("payBtn");
  const spinner = document.getElementById("spinner");
  const icon = document.getElementById("btnIcon");
  const txt = document.getElementById("btnText");
  btn.disabled = loading;
  spinner.style.display = loading ? "block" : "none";
  icon.style.display = loading ? "none" : "block";
  txt.textContent = loading ? "جاري المعالجة..." : "تأكيد الدفع";
}

// ─── Pay Function ────────────────────────────────────────────────
async function pay() {
  const uid = localStorage.getItem("uid");
  if (!uid) { alert("يجب تسجيل الدخول"); location.href = "auth.html"; return; }
  if (!gameId) { showAlert("لم يتم تحديد الملف"); return; }
  if (gamePrice <= 0) { showAlert("سعر الملف غير صحيح"); return; }

  setLoading(true);

  try {
    // ── 1. Check if already owned ─────────────────────────────
    const ownSnap = await db.ref("usersperfect/" + uid + "/gamesOwned/" + gameId).once("value");
    if (ownSnap.exists()) {
      showAlert("لقد اشتريت هذا الملف مسبقاً");
      setLoading(false);
      return;
    }

    // ── 2. Create PaymentIntent via Stripe (test mode: no backend needed) ──
    // في وضع الاختبار نستخدم confirmCardPayment مباشرة مع PaymentIntent من السيرفر
    // لأن لديك فقط frontend، سنستخدم Stripe Checkout أو نُنشئ PaymentIntent بـ fetch
    const intentRes = await fetch("https://api.stripe.com/v1/payment_intents", {
      method: "POST",
      headers: {
        "Authorization": "Bearer sk_test_51TPlrtRo5jOLZLnRIyWNRJysJ0Hr5k9v4lgBhw9sVETU41QgNT6n3vOeO1cl349ZOpWOq3RdzgwHip5t9JiPSBWz00WUk0bL2k",
        "Content-Type": "application/x-www-form-urlencoded"
      },
      body: new URLSearchParams({
        amount: Math.round(gamePrice * 100),
        currency: "usd",
        "automatic_payment_methods[enabled]": "true",
        "automatic_payment_methods[allow_redirects]": "never"
      })
    });

    const intent = await intentRes.json();

    if (intent.error) {
      showAlert("خطأ في إنشاء الدفع: " + intent.error.message);
      setLoading(false);
      return;
    }

    // ── 3. Confirm Payment with card details ──────────────────
    const { error, paymentIntent } = await stripe.confirmCardPayment(intent.client_secret, {
      payment_method: { card: cardElement }
    });

    if (error) {
      showAlert(error.message || "فشل الدفع، يرجى التحقق من بيانات البطاقة");
      setLoading(false);
      return;
    }

    if (paymentIntent.status === "succeeded") {
      // ── 4. Save to Firebase ───────────────────────────────
      await db.ref("usersperfect/" + uid + "/gamesOwned/" + gameId).set({
        purchasedAt: Date.now(),
        paymentId: paymentIntent.id,
        amount: gamePrice
      });

      await db.ref("orders").push({
        user: uid,
        game: gameId,
        price: gamePrice,
        paymentId: paymentIntent.id,
        date: Date.now()
      });

      // ── 5. Show success ───────────────────────────────────
      document.getElementById("formContent").style.display = "none";
      document.getElementById("successState").style.display = "block";
    }

  } catch (err) {
    console.error(err);
    showAlert("حدث خطأ غير متوقع، يرجى المحاولة مجدداً");
    setLoading(false);
  }
}
</script>
</body>
</html>
